# Base compose for all non-prod environments (local dev and remote/SSL).
#
# OVERRIDE CHAIN (last wins for lists like command:, ports:):
#   1. non.prod.compose.yml              ← THIS FILE (base)
#   2. frappe_docker/overrides/*.yaml    (mariadb, redis)
#   3. templates/docker/compose.*.yml    (https, uid-gid, dev, local-ports)
#   4. devops/docker/deploy.overrides.yml (per-deployment, gitignored)
#
# The final merge is rendered by `docker compose config` into devops/docker/*.yml.
# Deployment-specific overrides (extra ports, Traefik entrypoints, etc.) go in
# devops/docker/deploy.overrides.yml — gitignored, not committed. See
# templates/docker/compose.deploy-overrides.yml for the template and examples.

# Upstream frappe/bench image. BENCH_IMAGE/BENCH_TAG have ONE meaning in every stack: the
# upstream image (bench CLI + pyenv Pythons + nvm Node) the containers are based on. Without
# templates/docker/compose.uid-gid.yml it is run as-is; with it, it becomes the FROM of the
# locally built `bench:${BENCH_TAG}` wrapper (see that file).
# PULL_POLICY defaults to `never`: pin a new BENCH_TAG -> `docker pull` it first (or set `missing`).
x-customizable-image: &customizable_image
  image: ${BENCH_IMAGE:-frappe/bench}:${BENCH_TAG:-latest}
  pull_policy: "${PULL_POLICY:-never}"

x-depends-on-configurator: &depends_on_configurator
  depends_on:
    configurator:
      condition: service_completed_successfully

x-frappe-defaults: &frappe_defaults
  <<: [*depends_on_configurator, *customizable_image]
  platform: linux/amd64 # TODO: Add support for other platforms
  tty: true
  user: frappe
  volumes:
    # Mount ONLY the submodule's `development/` folder (gitignored) instead of the whole
    # `frappe_docker` submodule. Mounting the whole submodule leaks its `.git` pointer file
    # (`gitdir: ../.git/modules/frappe_docker`) into `/workspace/.git`; that relative path is
    # dangling inside the container, so every git command bench runs (e.g. `git ls-remote`
    # during `bench init`) aborts with "fatal: not a git repository".
    - workspace:/workspace/development:cached
  working_dir: /workspace/development

services:
  configurator:
    <<: *frappe_defaults
    command:
      - bash
      - -c
      - >
        BENCH_DIR="frappe-bench-$$FRAPPE_BRANCH";
        if [ ! -d "$$BENCH_DIR" ]; then
        PY="$${BENCH_PYTHON_VERSION:-auto}";
        if [ "$$PY" = auto ]; then unset PYENV_VERSION; else export PYENV_VERSION="$$PY"; fi;
        bench init
        --skip-redis-config-generation
        --frappe-branch "$$FRAPPE_BRANCH"
        --frappe-path https://github.com/frappe/frappe.git
        "$$BENCH_DIR"
        || { echo "configurator: bench init failed, removing partial $$BENCH_DIR so the next start retries" >&2;
        rm -rf "$$BENCH_DIR"; exit 1; };
        cd "$$BENCH_DIR";
        bench set-config -g db_host $$DB_HOST;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        fi;
    environment:
      FRAPPE_BRANCH: ${FRAPPE_BRANCH:-version-16}
      BENCH_PYTHON_VERSION: ${BENCH_PYTHON_VERSION:-auto}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-}
      REDIS_CACHE: ${REDIS_CACHE:-}
      REDIS_QUEUE: ${REDIS_QUEUE:-}
    depends_on: {}

  frappe:
    <<: *frappe_defaults
    command: sleep infinity
    environment:
      SHELL: /bin/bash
      # Same value the configurator used, so `cd frappe-bench-$FRAPPE_BRANCH` works in a shell.
      FRAPPE_BRANCH: ${FRAPPE_BRANCH:-version-16}
    # NOTE: no `ports:` here on purpose. Compose file-merging can ADD to a list but never
    # REMOVE entries, so any port published in this base would leak into every derived stack
    # (including the Traefik/SSL one, bypassing TLS). Host publishing is opt-in:
    #   - local dev  -> add `templates/docker/compose.local-ports.yml`
    #   - remote/SSL -> add `templates/docker/compose.non-prod-https.yaml` (Traefik reaches the
    #                   container over the docker network, no host ports needed)

volumes:
  workspace:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/frappe_docker/development
